name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: pasinpay
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pasinpay"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run env:generate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/pasinpay
      - name: Check changed source formatting
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only HEAD^ HEAD -- \
            '*.js' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.json' '*.jsonc')
          existing=()
          for file in "${files[@]}"; do
            if [[ -f "$file" && "$file" != apps/fumadocs/* ]]; then
              existing+=("$file")
            fi
          done
          if ((${#existing[@]})); then
            bunx biome check "${existing[@]}"
          fi
          if git diff --name-only HEAD^ HEAD -- apps/fumadocs | grep -q .; then
            (cd apps/fumadocs && bunx biome check .)
          fi
      - run: bun run check-types
      - run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/pasinpay
      - run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/pasinpay
          BETTER_AUTH_SECRET: ci-secret-that-is-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3000
          CORS_ORIGIN: http://localhost:3001
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
          OPENROUTER_API_KEY: ci-placeholder
          PASINPAY_ATTESTOR_PRIVATE_KEY: 0x1111111111111111111111111111111111111111111111111111111111111111
          GITHUB_APP_PRIVATE_KEY: ci-placeholder
          PASINPAY_RPC_URL: https://sepolia-rollup.arbitrum.io/rpc
      - name: Build production Docker images
        shell: bash
        run: |
          trap 'rm -f apps/web/.env apps/server/.env' EXIT
          cp apps/web/.env.example apps/web/.env
          cp apps/server/.env.example apps/server/.env
          docker compose build web server migrate worker

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
        working-directory: contracts
      - run: forge test -vv
        working-directory: contracts
