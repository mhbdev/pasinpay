name: pasinpay

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
        - server_env
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: .env
        required: false
      - path: apps/web/.env
        required: false
    environment:
      SERVER_URL: http://server:3000
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      secrets:
        - web_env
        - server_env
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
      - path: apps/server/.env
        required: false
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/pasinpay
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      secrets:
        - web_env
        - server_env
    init: true
    env_file:
      - path: .env
        required: false
      - path: apps/server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/pasinpay
    command: ["bun", "migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      secrets:
        - web_env
        - server_env
    init: true
    env_file:
      - path: .env
        required: false
      - path: apps/server/.env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/pasinpay
    command: ["bun", "dist/worker.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: pasinpay-postgres
    environment:
      POSTGRES_DB: pasinpay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pasinpay_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pasinpay_postgres_data:

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: .env
  server_env:
    file: .env
